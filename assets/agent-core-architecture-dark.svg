<text x="603" y="367" text-anchor="middle" font-size="15" fill="#AFCBDF">save / read</text>
<rect x="30" y="75" width="230" height="94" rx="8" fill="#1E405D" stroke="#83A8C3" stroke-width="1.5"/>
<text x="145.0" y="117.0" text-anchor="middle" font-size="21" font-weight="600" fill="#F0F6FA">Host Application</text>
<text x="145.0" y="144.0" text-anchor="middle" font-size="16" fill="#AFCBDF">models / auth / state</text>
<rect x="385" y="75" width="230" height="94" rx="8" fill="#1E405D" stroke="#E2B187" stroke-width="1.5"/>
<text x="500.0" y="117.0" text-anchor="middle" font-size="21" font-weight="600" fill="#F0F6FA">AgentService</text>
<text x="500.0" y="144.0" text-anchor="middle" font-size="16" fill="#AFCBDF">stream / lifecycle</text>
<rect x="740" y="75" width="230" height="94" rx="8" fill="#1E405D" stroke="#83A8C3" stroke-width="1.5"/>
<text x="855.0" y="117.0" text-anchor="middle" font-size="21" font-weight="600" fill="#F0F6FA">WorkflowRegistry</text>
<text x="855.0" y="144.0" text-anchor="middle" font-size="16" fill="#AFCBDF">explicit registration</text>
<rect x="740" y="240" width="230" height="94" rx="8" fill="#1E405D" stroke="#E2B187" stroke-width="1.5"/>
<text x="855.0" y="282.0" text-anchor="middle" font-size="21" font-weight="600" fill="#F0F6FA">Planning</text>
