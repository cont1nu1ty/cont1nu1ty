<text x="500.0" y="282.0" text-anchor="middle" font-size="21" font-weight="600" fill="#F0F6FA">Events &amp; Results</text>
<text x="500.0" y="309.0" text-anchor="middle" font-size="16" fill="#AFCBDF">RunEvent / RunResult</text>
