<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Agent Core architecture</title>
<desc id="desc">Host-injected agent execution, governed tools, events and persistence.</desc>
