<text x="603" y="367" text-anchor="middle" font-size="15" fill="#476781">save / read</text>
<rect x="30" y="75" width="230" height="94" rx="8" fill="#FFFFFF" stroke="#6F94B2" stroke-width="1.5"/>
<text x="145.0" y="117.0" text-anchor="middle" font-size="21" font-weight="600" fill="#173D60">Host Application</text>
