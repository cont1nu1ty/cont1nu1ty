<text x="500.0" y="117.0" text-anchor="middle" font-size="21" font-weight="600" fill="#173D60">AgentService</text>
<text x="500.0" y="144.0" text-anchor="middle" font-size="16" fill="#476781">stream / lifecycle</text>
