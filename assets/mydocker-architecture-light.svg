<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1290" viewBox="0 0 1160 1290" role="img" aria-labelledby="title desc">
<title id="title">mydocker 2.0: current M3 architecture and Docker/containerd responsibility map</title>
<desc id="desc">CLI and evaluator use a versioned UDS API. Inside the mydockerd process, server and daemon services call Engine, which uses persistent FileStore and Linux providers. Providers control separate Sandbox keeper and Attempt init/PID 1 shim processes. Keeper preserves shared namespaces. Init manages Attempt resources and supervises workload processes. A separate dashed reference section compares responsibilities with dockerd, containerd, containerd-shim and runc; these are not project dependencies. Image/content/snapshot/bundle and full networking remain planned M4+ scope.</desc>
